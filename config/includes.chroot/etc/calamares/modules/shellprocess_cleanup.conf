---
# Rend le système installé INDÉPENDANT de la clé Live : retire l'autologin Live et les fichiers Live.
dontChroot: false
timeout: 60
script:
    - "rm -f /etc/lightdm/lightdm.conf.d/50-kavrion-live.conf"
    - "rm -f /etc/sudoers.d/live /etc/sudoers.d/live-config"
    - "rm -rf /etc/live"
    - "rm -f /etc/skel/Desktop/kavrion-install.desktop"
    - "rm -f /usr/share/applications/kavrion-install.desktop"
