---
# Le partitionnement automatique ne vise QUE le disque choisi explicitement par l'utilisateur.
# Un avertissement et une confirmation sont affichés par Calamares avant toute écriture.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
userSwapChoices: [ none, small, file ]
initialSwapChoice: none
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
enableLuksAutomatedPartitioning: false
showNotEncryptedBootMessage: false
partitionLayout:
    - name: "kavrion-root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
