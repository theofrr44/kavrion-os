---
# Aucun mot de passe prédéfini : le compte est créé par l'utilisateur pendant l'installation.
defaultGroups: [ users, lp, video, audio, cdrom, floppy, plugdev, netdev, scanner, sudo ]
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "kavrion-${first}"
    forbidden_names: [ localhost ]
